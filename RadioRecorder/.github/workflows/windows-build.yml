name: Build RadioRecorder for Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller
      - name: Build GUI app (no Python needed at runtime)
        shell: pwsh
        run: python build_windows.py
      - name: Bundle portable FFmpeg
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile 'ffmpeg-win64.zip'
          Expand-Archive -Path 'ffmpeg-win64.zip' -DestinationPath 'ffmpeg-extract'
          $ffmpeg = Get-ChildItem -Path 'ffmpeg-extract' -File -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe missing in download' }
          Copy-Item $ffmpeg.FullName -Destination 'dist/RadioRecorder/ffmpeg.exe'
          Copy-Item 'README.md' -Destination 'dist/RadioRecorder/README.md'
          Copy-Item 'QUICKSTART_RU.md' -Destination 'dist/RadioRecorder/QUICKSTART_RU.md'
          'FFmpeg: https://ffmpeg.org/ — https://www.gyan.dev/ffmpeg/builds/ — License: https://ffmpeg.org/legal.html' | Set-Content -Path 'dist/RadioRecorder/FFmpeg-NOTICE.txt'
          Get-ChildItem -Path 'ffmpeg-extract' -File -Recurse -Include 'LICENSE','LICENSE.txt','COPYING*' | Select-Object -First 5 | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist/RadioRecorder/FFmpeg-$($_.Name)" -ErrorAction SilentlyContinue
          }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/RadioRecorder' -DestinationPath 'RadioRecorder-Windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: RadioRecorder-Windows-x64
          path: RadioRecorder-Windows-x64.zip
          retention-days: 30
